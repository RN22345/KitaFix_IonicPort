<ion-content [fullscreen]="true" class="acc-content">
  <main class="acc-page">
    <button type="button" class="acc-back" routerLink="/accounts-login" aria-label="Back to log in">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="acc-hero-icon"><ion-icon name="key-outline"></ion-icon></div>

    <h1 class="acc-title">Forgot password?</h1>
    <p class="acc-subtitle">
      Enter the email linked to your account and we'll send you a 6-digit code to reset your password.
    </p>

    @if (error()) {
      <p class="acc-error" role="alert">
        {{ error() }}
      </p>
    }

    <form class="acc-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="acc-field">
        <label for="email">Email address</label>
        <div class="acc-input" [class.is-invalid]="emailInvalid">
          <ion-icon name="mail-outline"></ion-icon>
          <input id="email" type="email" formControlName="email"
                 placeholder="you@example.com" autocomplete="email" />
        </div>
        @if (emailInvalid) {
          <small class="acc-error">Enter a valid email address.</small>
        }
      </div>

      <button
        type="submit"
        class="acc-btn"
        [disabled]="busy()">
        {{ busy() ? 'Sending...' : 'Send code' }}
      </button>
    </form>

    <p class="acc-footer">
      Remembered it? <a class="acc-link" routerLink="/accounts-login">Back to log in</a>
    </p>
  </main>
</ion-content>
