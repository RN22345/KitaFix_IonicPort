<ion-content [fullscreen]="true" class="acc-content">
  <main class="acc-page">
    <button type="button" class="acc-back" routerLink="/accounts-forgot-password" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="acc-hero-icon"><ion-icon name="lock-closed-outline"></ion-icon></div>

    <h1 class="acc-title">Create new password</h1>
    <p class="acc-subtitle">Your code is verified. Choose a new password for your account.</p>
    @if (error()) {
      <p class="acc-error" role="alert">
        {{ error() }}
      </p>
    }
    
    <form class="acc-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="acc-field">
        <label for="password">New password</label>
        <div class="acc-input" [class.is-invalid]="isInvalid('password')">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input id="password" formControlName="password" placeholder="Create a new password"
                 autocomplete="new-password" [type]="showPassword ? 'text' : 'password'" />
          <button type="button" class="acc-input__toggle" (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <ul class="acc-rules">
        @for (r of passwordRules; track r.label) {
          <li [class.is-met]="r.met">
            <ion-icon [name]="r.met ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>{{ r.label }}
          </li>
        }
      </ul>

      <div class="acc-field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="acc-input" [class.is-invalid]="passwordsDontMatch">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input id="confirmPassword" formControlName="confirmPassword" placeholder="Re-enter your new password"
                 autocomplete="new-password" [type]="showPassword ? 'text' : 'password'" />
        </div>
        @if (passwordsDontMatch) { <small class="acc-error">Passwords don't match.</small> }
      </div>

      <button
        type="submit"
        class="acc-btn"
        [disabled]="busy()">
        {{ busy() ? 'Saving...' : 'Reset password' }}
      </button>
    </form>

    <p class="acc-footer">
      <a class="acc-link" routerLink="/accounts-login">Back to log in</a>
    </p>
  </main>
</ion-content>
